<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro - NotApp</title>
  <link rel="stylesheet" href="./new.css">
  <script src="./register.js" defer></script>
</head>
<body>
<main class="auth-wrapper">
  <div class="auth-container">
    <h2>Crear cuenta</h2>
    <input type="text" id="regUsername" placeholder="Usuario" required>
    <input type="password" id="regPassword" placeholder="Contraseña" required>
    <input type="text" id="regNombreCompleto" placeholder="Nombre completo" required>
    <input type="email" id="regEmail" placeholder="Correo electrónico" required>
    <button id="registerBtn">Registrarse</button>
    <p class="auth-switch">
      ¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a>
    </p>
  </div>
</main>
</body>
</html>
